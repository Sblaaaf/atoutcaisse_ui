server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Types utilisés par Blazor WebAssembly
    types {
        application/wasm wasm;
        application/octet-stream dat dll pdb blat;
        application/json json;
    }
    include /etc/nginx/mime.types;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Routage côté client : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais en cache (sinon les mises à jour ne sont pas vues)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
